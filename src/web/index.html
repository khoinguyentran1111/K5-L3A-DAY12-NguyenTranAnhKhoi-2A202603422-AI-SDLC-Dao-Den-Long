<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cellipse cx='8' cy='9' rx='5' ry='6' fill='%23ffb347'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/web/style.css">
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div class="hud-tl"><div id="flames" class="flames" aria-label="Ngọn Lửa"></div></div>
    <div class="hud-tc"><div id="clock" class="clock">5:00</div><div id="nightLabel" class="night-label"></div></div>
    <div class="hud-tr">
      <div class="stat lamps" id="lampsStat"><span class="lbl">Đèn sáng</span> <span id="lamps">0/5</span> <span id="lampsNeed" class="need">cần 3</span></div>
      <div class="stat score"><span class="lbl">Điểm</span> <span id="score">0</span></div>
    </div>
    <div class="hud-bc">
      <div id="prompt" class="prompt" hidden></div>
      <div id="moteBar" class="mote-bar" aria-label="Đom đóm đang mang"></div>
    </div>
    <div class="hud-br">
      <div class="cd" id="cdDash"><div class="cd-fill"></div><span>Lướt</span><kbd>Shift</kbd></div>
      <div class="cd" id="cdPulse"><div class="cd-fill"></div><span>Tỏa Sáng</span><kbd>F</kbd></div>
      <div class="charm-ind" id="charmInd" hidden>Bùa Gió <b id="charmS">10</b>s</div>
    </div>
    <div id="arrow" class="arrow" hidden>➤</div>
    <div id="windWarn" class="wind-warn" hidden>🍃 Gió sắp nổi!</div>
    <div id="leaves" class="leaves"></div>
  </div>

  <div id="screen" class="screen">
    <div class="card" id="card"></div>
  </div>

  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
